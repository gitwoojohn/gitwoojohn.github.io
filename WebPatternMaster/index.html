<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek 모바일 클라이언트</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ── 인증 오버레이 ──────────────────────────────────────
         페이지 로드 시 가장 먼저 표시됨.
         script.js 에서 sessionStorage 토큰이 확인되면 숨김.
    ───────────────────────────────────────────────────────── -->
    <div class="auth-overlay" id="authOverlay">
      <div class="auth-card">
        <h2>비밀번호를 입력하세요</h2>
        <!-- autocomplete="off": 브라우저가 비밀번호를 저장하지 않도록 -->
        <input
          type="password"
          id="passwordInput"
          placeholder="비밀번호 입력"
          autocomplete="off"
        />
        <button type="button" id="authBtn">확인</button>
        <p class="auth-error" id="authError"></p>
      </div>
    </div>

    <!-- ── 메인 컨텐츠 ────────────────────────────────────────
         기본적으로 CSS display:none.
         인증 성공 시 .visible 클래스가 추가되어 표시됨.
    ───────────────────────────────────────────────────────── -->
    <div class="container" id="mainContainer">
      <header>
        <h1>DeepSeek Chat</h1>
        <p class="subtitle">모바일 AI 어시스턴트</p>
      </header>

      <main>
        <!-- 질문 입력 영역 (웹 접근성 title 속성 포함) -->
        <div class="input-group">
          <label for="prompt">질문 입력</label>
          <textarea
            id="prompt"
            placeholder="무엇이든 물어보세요..."
            title="질문 입력창"
          ></textarea>
        </div>

        <!-- 파일 첨부 영역 -->
        <div class="input-group">
          <label
            for="fileInput"
            class="file-custom-btn"
            title="참고할 텍스트 파일 첨부"
          >
            <!-- 클립 모양 SVG 아이콘 -->
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
              ></path>
            </svg>
            <span id="fileName">파일 선택하기</span>
          </label>
          <!-- 실제 file input 은 숨기고 커스텀 버튼으로 대체 -->
          <input
            type="file"
            id="fileInput"
            accept=".txt,.json,.md"
            onchange="updateFileName(this)"
          />
        </div>

        <!-- 전송 버튼 -->
        <button type="button" id="sendBtn" onclick="callDeepSeek()">전송하기</button>

        <!-- AI 응답 출력 영역 -->
        <section class="result-section">
          <h2>응답 결과</h2>
          <div id="result" class="result-box">답변이 여기에 표시됩니다.</div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
