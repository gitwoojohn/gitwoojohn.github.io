    <script>
      let allData = [];
      let trendChart = null;
      let currentFocusIdx = -1;
      const apiKey = ""; // API Key

      // --- Gemini API Logic ---
      async function callGemini(prompt) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: {
            parts: [
              {
                text: "당신은 로또 패턴 및 통계 분석 전문가입니다. 사용자의 데이터를 기반으로 통찰력 있고 전문적인 조언을 제공하세요. 답변은 한국어로 하며, 불필요한 서론은 제외하고 핵심 전략 위주로 친절하게 설명하세요. 마크다운 형식을 사용하여 가독성 있게 작성하세요.",
              },
            ],
          },
        };

        const retryRequest = async (retries = 5, delay = 1000) => {
          try {
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            if (!response.ok) throw new Error("API Request Failed");
            const data = await response.json();
            return (
              data.candidates?.[0]?.content?.parts?.[0]?.text ||
              "분석 결과를 가져오지 못했습니다."
            );
          } catch (error) {
            if (retries > 0) {
              await new Promise((res) => setTimeout(res, delay));
              return retryRequest(retries - 1, delay * 2);
            }
            throw error;
          }
        };

        return await retryRequest();
      }

      function openAIModal() {

        `;
      }

      }

      async function analyzeComboWithAI() {
        const val = document.getElementById("inputCombo").value;
        if (!val || val.length < 6)
          return showToast("분석할 숫자 소스를 먼저 입력해 주세요.");

        openAIModal();
        const digits = val.replace(/\D/g, "").split("").join(", ");
        const prompt = `사용자가 입력한 숫자 소스: [${digits}]. 이 숫자들을 조합하여 로또 6개 번호를 생성하려고 합니다. 이 소스에서 발견되는 특징을 분석하고, 당첨 확률을 높일 수 있는 AI만의 추천 조합 3쌍을 제안해 주세요. 각 조합에 대한 이유도 짧게 설명해 주세요.`;

        try {
          const result = await callGemini(prompt);
          // 간단한 마크다운 파싱 (볼드체 정도만)
          const formatted = result
            .replace(/\*\*(.*?)\*\*/g, '<b class="text-indigo-600">$1</b>')
            .replace(/\n/g, "<br>");
          document.getElementById("aiContent").innerHTML =
            `<div class="ai-response">${formatted}</div>`;
        } catch (err) {
          document.getElementById("aiContent").innerHTML =
            `<div class="text-red-500 font-bold text-center py-10">AI 분석 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>`;
        }
      }

      async function analyzeTrendWithAI() {
        if (!allData || allData.length === 0)
          return showToast("데이터를 먼저 로드해 주세요.");

        openAIModal();
        const count = 15;
        const start = Math.max(0, currentFocusIdx - Math.floor(count / 2));
        const end = Math.min(allData.length, start + count);
        const slice = allData.slice(start, end);

        const dataSummary = slice
          .map((r) => `회차: ${r["회차"]}, AC: ${r["AC"]}, SD: ${r["편차"]}`)
          .join("\n");
        const prompt = `최근 15회차의 로또 통계 데이터입니다:\n${dataSummary}\n현재 복잡도(AC)와 표준편차(SD)의 흐름을 분석해 주세요. 현재 패턴이 안정한지 아니면 급변 구간인지, 다음 회차에서 예상되는 AC 수치 범위와 그 이유를 전문가적 관점에서 설명해 주세요.`;

        try {
          const result = await callGemini(prompt);
          const formatted = result
            .replace(/\*\*(.*?)\*\*/g, '<b class="text-indigo-600">$1</b>')
            .replace(/\n/g, "<br>");
          document.getElementById("aiContent").innerHTML =
            `<div class="ai-response">${formatted}</div>`;
        } catch (err) {
          document.getElementById("aiContent").innerHTML =
            `<div class="text-red-500 font-bold text-center py-10">AI 분석 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>`;
        }
      }

      // --- Existing Core Logic ---
      function setText(id, value) {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      }

      function getBallColor(n) {
        if (n < 10) return "bg-yellow-500";
        if (n < 20) return "bg-blue-500";
        if (n < 30) return "bg-red-500";
        if (n < 40) return "bg-slate-500";
        return "bg-green-500";
      }

      function getBandId(n) {
        if (n < 10) return 0;
        if (n < 20) return 1;
        if (n < 30) return 2;
        if (n < 40) return 3;
        return 4;
      }

      function switchTab(tabId) {
        ["tab1", "tab2", "tab3", "tab4"].forEach((id) => {
          const btn = document.getElementById(`btn-${id}`);
          const section = document.getElementById(`${id}-section`);
          if (btn) btn.classList.toggle("tab-active", id === tabId);
          if (section) section.classList.toggle("hidden", id !== tabId);
        });
        if (tabId === "tab3") updateChartView();
        document.getElementById("contentArea").scrollTop = 0;
      }

      function handleFileSelect(files) {
        if (files && files.length > 0) {
          Papa.parse(files[0], {
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            complete: (results) => processData(results),
          });
        }
      }

      function processData(results) {
        if (results?.data?.length > 0) {
          allData = results.data.filter((row) => row["회차"]);
          const picker = document.getElementById("roundPicker");
          if (picker) {
            picker.innerHTML = '<option value="">회차 선택</option>';
            const latest = Number(allData[allData.length - 1]["회차"]);
            picker.add(new Option(`${latest + 1}회 (예정)`, latest + 1));
            [...allData]
              .reverse()
              .forEach((row) =>
                picker.add(new Option(`${row["회차"]}회`, row["회차"])),
              );
          }
          currentFocusIdx = allData.length - 1;
        }
      }

      function runCombo() {
        const val = document.getElementById("inputCombo").value;
        const resArea = document.getElementById("comboResult");
        if (!val) {
          resArea.classList.add("hidden");
          return;
        }
        resArea.classList.remove("hidden");

        const digits = val.replace(/\D/g, "").split("").map(Number);
        const pool = document.getElementById("digitPool");
        pool.innerHTML = "";
        [...digits]
          .sort((a, b) => a - b)
          .forEach((d) => {
            const s = document.createElement("span");
            s.className =
              "w-7 h-7 flex items-center justify-center bg-slate-100 border rounded-full font-bold text-xs shadow-sm text-slate-700";
            s.textContent = d;
            pool.appendChild(s);
          });

        let targets = new Set();
        let bonus = null;
        const selRound = document.getElementById("roundPicker").value;
        if (selRound && allData.length > 0) {
          const row = allData.find(
            (r) => Number(r["회차"]) === Number(selRound),
          );
          if (row) {
            document
              .getElementById("roundDetailBox")
              .classList.remove("hidden");
            document.getElementById("t1DetRound").textContent =
              `${row["회차"]}회`;
            const nums = [
              row["1번"],
              row["2번"],
              row["3번"],
              row["4번"],
              row["5번"],
              row["6번"],
            ].map(Number);
            bonus = Number(row["보너스"]);
            const numArea = document.getElementById("t1DetNumbers");
            numArea.innerHTML = "";
            nums.forEach((n) => {
              targets.add(n);
              const s = document.createElement("span");
              s.className = `w-6 h-6 ${getBallColor(n)} rounded-full flex items-center justify-center text-[10px] font-bold text-white shadow-sm`;
              s.textContent = n;
              numArea.appendChild(s);
            });
            document.getElementById("t1DetBonus").textContent = bonus;
            document.getElementById("t1DetSum").textContent =
              row["합계"] || nums.reduce((a, b) => a + b, 0);
            const odd = nums.filter((n) => n % 2 !== 0).length;
            document.getElementById("t1DetOddEven").textContent =
              `${odd}:${6 - odd}`;
            document.getElementById("t1DetAC").textContent = row["AC"] || "0";
          }
        }

        const validSet = new Set();
        digits.forEach((d, i) => {
          if (d >= 1 && d <= 9) validSet.add(d);
          digits.forEach((next, j) => {
            if (i === j) return;
            const combined = parseInt(`${d}${next}`);
            if (combined >= 1 && combined <= 45) validSet.add(combined);
          });
        });

        const list = document.getElementById("possibleList");
        list.innerHTML = "";
        Array.from(validSet)
          .sort((a, b) => a - b)
          .forEach((num) => {
            const isMatch = targets.has(num);
            const isBonus = num === bonus;
            let ring = isMatch
              ? "ring-4 ring-indigo-400 ring-offset-2 scale-110 z-10"
              : isBonus
                ? "ring-4 ring-amber-400 ring-offset-2 scale-110 z-10"
                : "";
            const s = document.createElement("span");
            s.className = `w-9 h-9 flex items-center justify-center rounded-full font-black text-[12px] text-white shadow-md m-2 transition-all ${getBallColor(num)} ${ring} ${!isMatch && !isBonus ? "opacity-90" : ""}`;
            s.textContent = num;
            list.appendChild(s);
          });
      }

      function runAnalysis() {
        const input = document.getElementById("inputAnalysis").value;
        const nums = input
          .split(/[.\s,]+/)
          .filter((v) => v)
          .map(Number)
          .filter((n) => !isNaN(n) && n >= 1 && n <= 45);
        if (nums.length < 6)
          return showToast("6개 이상의 유효한 숫자를 입력하세요.");
        document.getElementById("analysisResult").classList.remove("hidden");
        const sNums = [...nums].sort((a, b) => a - b).slice(0, 6);

        const sum = sNums.reduce((a, b) => a + b, 0);
        setText("anSum", sum);
        const odd = sNums.filter((n) => n % 2 !== 0).length;
        setText("anOddEven", `${odd}:${6 - odd}`);

        const mean = sum / 6;
        const variance =
          sNums.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / 6;
        setText("anSD", Math.sqrt(variance).toFixed(1));

        const diffs = new Set();
        for (let i = 0; i < 6; i++)
          for (let j = i + 1; j < 6; j++) diffs.add(sNums[j] - sNums[i]);
        const ac = diffs.size - 5;
        setText("acValue", ac);
        const acI = document.getElementById("acInterp");
        acI.textContent = ac >= 7 ? "복잡도 높음" : "복잡도 낮음";
        acI.className = `px-6 py-1.5 rounded-full text-sm font-black mt-2 ${ac >= 7 ? "bg-green-600" : "bg-amber-500"} text-white text-center`;

        const patterns = [0, 0, 0, 0, 0];
        sNums.forEach((n) => patterns[getBandId(n)]++);
        setText("anPattern", patterns.join(":"));
      }

      function searchByRound() {
        if (allData.length === 0) return showToast("데이터 로드 필요");
        const inputVal = document.getElementById("searchRound").value.trim();
        if (!inputVal) return;

        const isPatternMode = document.getElementById("patternMode").checked;
        const matchListArea = document.getElementById("matchListArea");
        const matchButtons = document.getElementById("matchButtons");

        if (matchListArea) matchListArea.classList.add("hidden");
        if (matchButtons) matchButtons.innerHTML = "";

        if (isPatternMode) {
          const pattern = (inputVal.match(/\d+/g) || []).map(Number);
          if (pattern.length === 0) return;

          let matches = [];
          for (let i = 0; i <= allData.length - pattern.length; i++) {
            let isMatch = true;
            for (let j = 0; j < pattern.length; j++) {
              if (Number(allData[i + j]["AC"]) !== pattern[j]) {
                isMatch = false;
                break;
              }
            }
            if (isMatch) matches.push(i + pattern.length - 1);
          }

          if (matches.length > 0) {
            matchListArea.classList.remove("hidden");
            matches.forEach((idx) => {
              const btn = document.createElement("button");
              btn.className =
                "flex-shrink-0 px-4 py-2 bg-slate-100 border border-slate-200 rounded-xl text-[12px] font-bold text-slate-700 active:bg-indigo-600 active:text-white shadow-sm";
              btn.textContent = `${allData[idx]["회차"]}회`;
              btn.onclick = () => jumpToRound(idx);
              matchButtons.appendChild(btn);
            });
            jumpToRound(matches[0]);
          } else showToast("일치하는 패턴이 없습니다.");
        } else {
          const targetRound = parseInt(inputVal);
          const idx = allData.findIndex(
            (r) => Number(r["회차"]) === Number(targetRound),
          );
          if (idx !== -1) jumpToRound(idx);
          else showToast("회차 정보 없음");
        }
      }

      function jumpToRound(idx) {
        if (idx < 0 || idx >= allData.length) return;
        currentFocusIdx = idx;
        updateChartView();
        showRoundDetail(allData[idx]);
      }

      function showRoundDetail(row) {
        const detail = document.getElementById("roundDetail");
        if (detail) detail.classList.remove("hidden");

        document.getElementById("detRound").textContent = `${row["회차"]}회`;
        const nums = [
          row["1번"],
          row["2번"],
          row["3번"],
          row["4번"],
          row["5번"],
          row["6번"],
        ].map(Number);
        const numArea = document.getElementById("detNumbers");
        numArea.innerHTML = "";
        nums.forEach((n) => {
          const s = document.createElement("span");
          s.className = `w-7 h-7 ${getBallColor(n)} rounded-full flex items-center justify-center text-xs font-bold text-white shadow-sm`;
          s.textContent = n;
          numArea.appendChild(s);
        });
        document.getElementById("detBonus").textContent = row["보너스"];
        document.getElementById("detSum").textContent =
          row["합계"] || nums.reduce((a, b) => a + b, 0);
        const odd = nums.filter((n) => n % 2 !== 0).length;
        document.getElementById("detOddEven").textContent = `${odd}:${6 - odd}`;
        document.getElementById("detAC").textContent = row["AC"];
        document.getElementById("detSD").textContent =
          typeof row["편차"] === "number"
            ? row["편차"].toFixed(1)
            : row["편차"] || "0.0";
      }

      function updateChartView() {
        if (!allData || allData.length === 0) return;
        const count = 15;
        const start = Math.max(0, currentFocusIdx - Math.floor(count / 2));
        const end = Math.min(allData.length, start + count);
        initChart(
          allData.slice(start, end),
          Number(allData[currentFocusIdx]["회차"]),
        );
      }

      function initChart(data, targetRound) {
        const ctx = document.getElementById("patternChart").getContext("2d");
        if (trendChart) trendChart.destroy();
        trendChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: data.map((r) => `${r["회차"]}회`),
            datasets: [
              {
                label: "AC",
                data: data.map((r) => r["AC"]),
                borderColor: "#4f46e5",
                backgroundColor: "#4f46e5",
                pointBackgroundColor: data.map((r) =>
                  Number(r["회차"]) === targetRound ? "#ef4444" : "#4f46e5",
                ),
                pointRadius: data.map((r) =>
                  Number(r["회차"]) === targetRound ? 8 : 4,
                ),
                // 베이지어 곡선 0.3 ~ 0.4 부드러움
                tension: 0,
              },
              {
                label: "SD",
                data: data.map((r) => r["편차"]),
                borderColor: "#8b5cf6",
                backgroundColor: "#8b5cf6",
                pointBackgroundColor: data.map((r) =>
                  Number(r["회차"]) === targetRound ? "#ef4444" : "#8b5cf6",
                ),
                pointRadius: data.map((r) =>
                  Number(r["회차"]) === targetRound ? 8 : 4,
                ),
                tension: 0,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            onClick: (e, elements) => {
              if (elements.length > 0) {
                const idxInSlice = elements[0].index;
                const roundNum = data[idxInSlice]["회차"];
                const globalIdx = allData.findIndex(
                  (r) => Number(r["회차"]) === Number(roundNum),
                );
                if (globalIdx !== -1) jumpToRound(globalIdx);
              }
            },
            plugins: {
              legend: {
                display: true,
                position: "top",
                labels: { boxWidth: 10, font: { size: 9 } },
              },
              datalabels: {
                display: true,
                align: "top",
                anchor: "end",
                font: { size: 8, weight: "bold" },
                formatter: (v, c) =>
                  c.dataset.label === "SD" ? v.toFixed(1) : v,
                color: (c) => c.dataset.borderColor,
              },
            },
            scales: {
              y: { beginAtZero: true, ticks: { font: { size: 10 } } },
              x: { ticks: { font: { size: 10 } } },
            },
          },
          plugins: [ChartDataLabels],
        });
      }

      function runAdvancedSearch() {
        const resultsEl = document.getElementById("advancedResults");
        if (!allData || allData.length === 0)
          return showToast("데이터를 로드해주세요.");

        const inputs = [1, 2, 3, 4, 5, 6].map((i) => {
          const v = document.getElementById(`n${i}`).value;
          return v ? parseInt(v) : null;
        });

        const bonusVal = document.getElementById("bn").value
          ? parseInt(document.getElementById("bn").value)
          : null;
        const isRange = document.getElementById("rangeMode").checked;
        const isSeq = document.getElementById("seqMode").checked;
        const isLatest = document.getElementById("sortLatest").checked;

        if (inputs.every((v) => v === null) && bonusVal === null)
          return showToast("검색할 번호를 입력하세요.");

        const matches = [];
        allData.forEach((row, idx) => {
          const rowNums = [1, 2, 3, 4, 5, 6].map((i) =>
            parseInt(row[`${i}번`]),
          );
          const rowBonus = parseInt(row["보너스"]);
          let found = false;

          if (!isRange) {
            let isPosMatch = true;
            for (let i = 0; i < 6; i++) {
              if (inputs[i] !== null && rowNums[i] !== inputs[i]) {
                isPosMatch = false;
                break;
              }
            }
            if (bonusVal !== null && rowBonus !== bonusVal) isPosMatch = false;
            if (isPosMatch) found = true;
          } else {
            let isBandMatch = true;
            for (let i = 0; i < 6; i++) {
              if (
                inputs[i] !== null &&
                getBandId(rowNums[i]) !== getBandId(inputs[i])
              ) {
                isBandMatch = false;
                break;
              }
            }
            if (
              bonusVal !== null &&
              getBandId(rowBonus) !== getBandId(bonusVal)
            )
              isBandMatch = false;
            if (isBandMatch) found = true;
          }
          if (found)
            matches.push({ current: row, next: allData[idx + 1] || null });
        });

        if (isLatest)
          matches.sort((a, b) => b.current["회차"] - a.current["회차"]);
        else matches.sort((a, b) => a.current["회차"] - b.current["회차"]);

        resultsEl.classList.remove("hidden");
        resultsEl.innerHTML = `<div class="text-[10px] font-black text-slate-400 px-1 uppercase tracking-widest mb-3 flex justify-between items-center"><span>검색 분석 결과</span><span class="bg-indigo-600 text-white px-2 py-0.5 rounded-full text-[9px]">TOTAL: ${matches.length}</span></div>`;

        if (matches.length === 0) {
          resultsEl.innerHTML += `<div class="py-20 text-center text-slate-400 font-bold">❌ 일치하는 패턴 없음</div>`;
          return;
        }

        matches.forEach((m) => {
          const row = m.current;
          const nxt = m.next;
          const currNums = [1, 2, 3, 4, 5, 6].map((i) =>
            parseInt(row[`${i}번`]),
          );

          const card = document.createElement("div");
          card.className =
            "bg-slate-900 text-white p-4 rounded-xl shadow-lg space-y-2 font-mono text-left mb-4";

          const sum = row["합계"] || currNums.reduce((a, b) => a + b, 0);
          const odd = currNums.filter((n) => n % 2 !== 0).length;
          const ac = row["AC"] || 0;
          const sd =
            typeof row["편차"] === "number"
              ? row["편차"].toFixed(1)
              : row["편차"] || "0.0";

          let html = `
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
              <span class="text-indigo-400 font-black text-lg">${row["회차"]}회</span>
              <div class="flex gap-1">
                ${currNums
                  .map((n, i) => {
                    const isTarget = inputs[i] !== null;
                    const isMatch =
                      isTarget &&
                      (isRange
                        ? getBandId(n) === getBandId(inputs[i])
                        : n === inputs[i]);
                    return `<span class="w-7 h-7 ${getBallColor(n)} rounded-full flex items-center justify-center text-xs font-bold text-white shadow-sm ${isMatch ? "ring-2 ring-white scale-110 z-10" : ""}">${n}</span>`;
                  })
                  .join("")}
              </div>
              <span class="w-7 h-7 bg-amber-500 rounded-full flex items-center justify-center text-[12px] font-bold text-black shadow-sm ${bonusVal !== null && (isRange ? getBandId(parseInt(row["보너스"])) === getBandId(bonusVal) : parseInt(row["보너스"]) === bonusVal) ? "ring-2 ring-white scale-110" : ""}">${row["보너스"]}</span>
            </div>
            <div class="flex justify-between text-[11px] pt-1 text-slate-300">
              <span>합계: <b class="text-white">${sum}</b></span>
              <span>홀짝: <b class="text-white">${odd}:${6 - odd}</b></span>
              <span>AC: <b class="text-white">${ac}</b></span>
              <span>SD: <b class="text-white">${sd}</b></span>
            </div>
          `;

          if (isSeq && nxt) {
            const nxtNums = [1, 2, 3, 4, 5, 6].map((i) =>
              parseInt(nxt[`${i}번`]),
            );
            html += `
              <div class="pt-3 border-t border-slate-700 flex flex-col items-center">
                <div class="text-[9px] font-bold text-white-400 bg-rose-900/50 px-3 py-1 rounded-full mb-3">차기 ${nxt["회차"]}회 결과</div>
                <div class="flex gap-1.5 justify-center">
                  ${nxtNums.map((n) => `<span class="w-7 h-7 ${getBallColor(n)} rounded-full flex items-center justify-center text-xs font-bold text-white shadow-sm ${currNums.includes(n) ? "ring-2 ring-rose-500 scale-110 z-10" : "opacity-80"}">${n}</span>`).join("")}
                </div>
              </div>`;
          }
          card.innerHTML = html;
          resultsEl.appendChild(card);
        });
        resultsEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      window.onload = () => {
        switchTab("tab1");
        Papa.parse("https://gitwoojohn.github.io/ReadWeb-WinningNumbers.csv", {
          download: true,
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true,
          complete: (res) => processData(res),
        });
      };
    </script>
  </body>
</html>
